version: '3.8'

services:
  backend:
    image: apsi_dockerized_thesis_backend-backend:latest
    container_name: thesis-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
    restart: always

  db:
    image: postgres:15
    container_name: thesis-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: smarttarget
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarttarget"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  frontend:
    image: smart-target-frontend:latest
    container_name: smart-target-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  admin:
    image: smart-target-admin:latest
    container_name: smart-target-admin
    ports:
      - "4000:4000"
    depends_on:
      - backend
    restart: always
